<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 242" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ROCgdb architecture</title>
  <desc id="d">The host software stack (HIP application, HSA runtime (ROCr), amdgpu driver) sits above the AMD GPU. Four dashed arrows from ROCgdb point at the four layers, one at each.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ed1c24"/>
    </marker>
  </defs>
  <rect width="460" height="242" fill="#ffffff"/>

  <!-- group labels -->
  <g fill="none" stroke="#868e96" stroke-width="1">
    <path d="M30 24 V146"/>
    <path d="M30 166 V226"/>
  </g>
  <g font-size="10" font-weight="700" letter-spacing="1.5" fill="#6e7781" text-anchor="middle">
    <text transform="translate(18 85) rotate(-90)">HOST</text>
    <text transform="translate(18 196) rotate(-90)">DEVICE</text>
  </g>

  <!-- HIP application -->
  <polygon points="44,24 54,16 284,16 274,24" fill="#eef4fd" stroke="#5f8fd8" stroke-width="0.8"/>
  <polygon points="274,24 284,16 284,54 274,62" fill="#b7cdf0" stroke="#5f8fd8" stroke-width="0.8"/>
  <rect x="44" y="24" width="230" height="38" fill="#dbe8fb" stroke="#5f8fd8" stroke-width="0.8"/>
  <text x="56" y="40" font-size="12" font-weight="700" fill="#0b57d0">Your HIP application</text>
  <text x="56" y="55" font-size="11" fill="#57606a">host code · GPU kernels</text>

  <!-- HSA runtime (ROCr) -->
  <polygon points="44,80 54,72 284,72 274,80" fill="#fafafa" stroke="#868e96" stroke-width="0.8"/>
  <polygon points="274,80 284,72 284,96 274,104" fill="#dcdfe3" stroke="#868e96" stroke-width="0.8"/>
  <rect x="44" y="80" width="230" height="24" fill="#f0f1f3" stroke="#868e96" stroke-width="0.8"/>
  <text x="56" y="96" font-size="12" font-weight="700" fill="#1f2328">HSA runtime (ROCr)</text>

  <!-- amdgpu driver -->
  <polygon points="44,122 54,114 284,114 274,122" fill="#fafafa" stroke="#868e96" stroke-width="0.8"/>
  <polygon points="274,122 284,114 284,138 274,146" fill="#dcdfe3" stroke="#868e96" stroke-width="0.8"/>
  <rect x="44" y="122" width="230" height="24" fill="#f0f1f3" stroke="#868e96" stroke-width="0.8"/>
  <text x="56" y="138" font-size="12" font-weight="700" fill="#1f2328">amdgpu driver</text>

  <!-- AMD GPU -->
  <polygon points="44,166 54,158 284,158 274,166" fill="#3a4048" stroke="#1f2328" stroke-width="0.8"/>
  <polygon points="274,166 284,158 284,218 274,226" fill="#0d1014" stroke="#1f2328" stroke-width="0.8"/>
  <rect x="44" y="166" width="230" height="60" fill="#1f2328" stroke="#1f2328" stroke-width="0.8"/>
  <text x="56" y="184" font-size="12" font-weight="700" fill="#ffffff">AMD GPU</text>
  <text x="56" y="201" font-size="11" fill="#c9d1d9">agents · queues · dispatches</text>
  <text x="56" y="216" font-size="11" fill="#c9d1d9">waves · lanes</text>

  <!-- ROCgdb -->
  <g stroke="#ed1c24" stroke-width="1" stroke-dasharray="4 3" fill="none">
    <path d="M338 43 H290" marker-end="url(#arrow)"/>
    <path d="M338 92 H290" marker-end="url(#arrow)"/>
    <path d="M338 134 H290" marker-end="url(#arrow)"/>
    <path d="M338 190 H290" marker-end="url(#arrow)"/>
  </g>
  <path d="M338 43 V190" stroke="#ed1c24" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <path d="M338 116 H352" stroke="#ed1c24" stroke-width="1" fill="none"/>
  <rect x="352" y="91" width="96" height="50" rx="5" fill="#ffffff" stroke="#ed1c24" stroke-width="1.2"/>
  <text x="400" y="113" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">ROCgdb</text>
  <text x="400" y="129" font-size="11" fill="#57606a" text-anchor="middle">debugger</text>
</svg>
