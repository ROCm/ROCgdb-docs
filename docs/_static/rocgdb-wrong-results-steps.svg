<title id="t">Steps to find a wrong value in a kernel</title>
<desc id="d">Flowchart. Step 1: does catch hiperr stop on a HIP error? If yes, fix the failing HIP call. If no, step 2: work out which work-item wrote a wrong element. Step 3: stop only that work-item with a conditional breakpoint. Step 4: are the values it reads correct? If no, the bug is earlier, in a host copy or the kernel that produced the input. If yes, step 5: step and print. If the value goes wrong in this work-item, you found the line. If not, step 6: watch the output to see what overwrites it.</desc>
