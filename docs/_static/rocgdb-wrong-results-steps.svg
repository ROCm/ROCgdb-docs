<title id="t">Steps to find a wrong value in a kernel</title>
<desc id="d">Flowchart. Start: some output values are wrong. Step 1: does catch hiperr stop on a HIP error? If yes, fix the failing HIP call. The kernel might be fine. If no, step 2: work out which work-item wrote a wrong element. Step 3: stop only that work-item with a conditional breakpoint. Step 4: are the values this work-item reads correct? If no, the bug is earlier: check the host copy, or repeat from step 2 for the kernel that produced the input. If yes, step 5: step and print. If the value goes wrong in this work-item, you found the line. Fix the code. If not, step 6: the value is right here, so watch the output to see what overwrites it. ROCgdb stops at the write that changes the value. Fix that code.</desc>
