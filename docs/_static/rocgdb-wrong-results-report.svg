<title id="t">Where to send a wrong-value problem</title>
<desc id="d">Flowchart. Start: ROCgdb's value doesn't match an independent check, such as a device printf, the host value after hipMemcpy, or the application's output. If a row in Known limitations matches, use that row's workaround, or accept the behavior as expected if it has none. Otherwise, if the problem is in the documentation, open a ROCgdb-docs issue. If not, search ROCgdb issues, then open one with the evidence.</desc>
