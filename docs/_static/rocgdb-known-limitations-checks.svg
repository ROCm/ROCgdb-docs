<title id="t">Checks for a ROCgdb problem</title>
<desc id="d">Flowchart. Start: ROCgdb doesn't do what you expect. Check 1: does info agents list your GPU with state A? If no, read the amd-dbgapi warnings and fix the driver, firmware, or runtime, then check again. If yes, check 3: is the GPU code built with -ggdb -O0? If no, rebuild and check again. If yes, check 4: does a row in the limitations tables match? If yes, use the workaround in that row. If no, report a problem.</desc>
