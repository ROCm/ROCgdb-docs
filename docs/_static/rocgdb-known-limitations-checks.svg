<title id="t">Checks for a ROCgdb problem</title>
<desc id="d">Flowchart. Start: ROCgdb doesn't do what you expect. Check 1: does info agents list your GPU with state A? If no, is your GPU listed with state U? If it isn't listed at all, run rocminfo outside ROCgdb, fix the ROCm installation if it lists no gfx agent, otherwise check ROCR_VISIBLE_DEVICES, HIP_VISIBLE_DEVICES, and the container device mapping, then go back to check 1. If it's listed with U, is its architecture in the supported list? If it isn't, there's no workaround on that GPU. If it is, step 2: read the amd-dbgapi warnings and fix the driver, firmware, or runtime, then go back to check 1. If yes, check 3: is the GPU code built with -ggdb -O0 and Code Object V3 or later? If no, rebuild with your current ROCm compiler and -ggdb -O0, which also fixes the ELF file ABI version (0) error, then go back to check 3. If yes, check 4: does a row in the limitations tables match? If yes, use the workaround in that row. If no, report a problem.</desc>
