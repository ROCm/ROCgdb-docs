<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How to read a ROCgdb wave ID and lane ID</title>
  <desc id="d">The wave ID AMDGPU Wave 1:2:1:1 (0,0,0)/0 is split into the agent, queue, dispatch, and wave numbers, the work-group position, and the wave index within the work-group. The lane ID AMDGPU Lane 1:2:1:1/0 (0,0,0)[0,0,0] adds the lane index and the work-item position within the work-group. Each part is labeled, and the commands that list agents, queues, dispatches, waves, and lanes are shown.</desc>
  <rect width="680" height="290" fill="#ffffff"/>

  <!-- Panel 1: wave ID -->
  <text x="20" y="26" font-size="14" font-weight="bold" fill="#1f2328">Wave ID</text>
  <text x="84" y="26" font-size="13" font-family="Menlo, Consolas, monospace" fill="#57606a">AMDGPU Wave 1:2:1:1 (0,0,0)/0</text>

  <g stroke-width="1.5">
    <rect x="20" y="44" width="80" height="36" rx="6" fill="#dbe8fb" stroke="#9db8e6"/>
    <rect x="124" y="44" width="80" height="36" rx="6" fill="#dbe8fb" stroke="#9db8e6"/>
    <rect x="228" y="44" width="80" height="36" rx="6" fill="#dbe8fb" stroke="#9db8e6"/>
    <rect x="332" y="44" width="80" height="36" rx="6" fill="#0b57d0" stroke="#0b57d0"/>
    <rect x="440" y="44" width="110" height="36" rx="6" fill="#ffffff" stroke="#9db8e6"/>
    <rect x="570" y="44" width="60" height="36" rx="6" fill="#ffffff" stroke="#9db8e6"/>
  </g>
  <g font-size="16" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#1f2328">
    <text x="60" y="68">1</text>
    <text x="164" y="68">2</text>
    <text x="268" y="68">1</text>
    <text x="372" y="68" fill="#ffffff">1</text>
    <text x="112" y="68" fill="#57606a">:</text>
    <text x="216" y="68" fill="#57606a">:</text>
    <text x="320" y="68" fill="#57606a">:</text>
    <text x="495" y="68">(0,0,0)</text>
    <text x="600" y="68">/0</text>
  </g>

  <g font-size="13" text-anchor="middle" fill="#1f2328">
    <text x="60" y="102" font-weight="bold">agent</text>
    <text x="164" y="102" font-weight="bold">queue</text>
    <text x="268" y="102" font-weight="bold">dispatch</text>
    <text x="372" y="102" font-weight="bold">wave</text>
    <text x="495" y="102" font-weight="bold">work-group</text>
    <text x="495" y="116" font-weight="bold">position</text>
    <text x="600" y="102" font-weight="bold">wave index</text>
    <text x="600" y="116" font-weight="bold">in work-group</text>
  </g>
  <g font-size="12" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#0b57d0">
    <text x="60" y="120">info agents</text>
    <text x="164" y="120">info queues</text>
    <text x="268" y="120">info dispatches</text>
    <text x="372" y="120">info threads</text>
  </g>

  <line x1="20" y1="148" x2="660" y2="148" stroke="#c4cad0" stroke-width="1"/>

  <!-- Panel 2: lane ID -->
  <text x="20" y="176" font-size="14" font-weight="bold" fill="#1f2328">Lane ID</text>
  <text x="88" y="176" font-size="13" font-family="Menlo, Consolas, monospace" fill="#57606a">AMDGPU Lane 1:2:1:1/0 (0,0,0)[0,0,0]</text>

  <g stroke-width="1.5">
    <rect x="20" y="194" width="130" height="36" rx="6" fill="#dbe8fb" stroke="#9db8e6"/>
    <rect x="162" y="194" width="60" height="36" rx="6" fill="#0b57d0" stroke="#0b57d0"/>
    <rect x="250" y="194" width="110" height="36" rx="6" fill="#ffffff" stroke="#9db8e6"/>
    <rect x="378" y="194" width="110" height="36" rx="6" fill="#ffffff" stroke="#9db8e6"/>
  </g>
  <g font-size="16" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#1f2328">
    <text x="85" y="218">1:2:1:1</text>
    <text x="192" y="218" fill="#ffffff">/0</text>
    <text x="305" y="218">(0,0,0)</text>
    <text x="433" y="218">[0,0,0]</text>
  </g>

  <g font-size="13" text-anchor="middle" fill="#1f2328">
    <text x="85" y="252" font-weight="bold">wave ID</text>
    <text x="192" y="252" font-weight="bold">lane index</text>
    <text x="305" y="252" font-weight="bold">work-group</text>
    <text x="305" y="266" font-weight="bold">position</text>
    <text x="433" y="252" font-weight="bold">work-item position</text>
    <text x="433" y="266" font-weight="bold">in work-group</text>
  </g>
  <g font-size="12" font-family="Menlo, Consolas, monospace" text-anchor="middle" fill="#0b57d0">
    <text x="192" y="270">info lanes</text>
  </g>
</svg>
