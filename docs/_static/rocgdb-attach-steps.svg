<title id="t">Steps to attach ROCgdb to a running process</title>
<desc id="d">Flowchart. Start: you need to debug an application that is already running. If you can restart it, step 1: restart it with HSA_ENABLE_DEBUG=1. If not, attach anyway, and waves that already exist might show a question mark in their IDs. Step 2: find the process ID. Step 3: does rocgdb -p PID attach? If not, fix the container setup, or ask your administrator about ptrace, then go back to step 3. Step 4: does info threads show AMDGPU Wave entries? If yes, step 5a: inspect the waves that are running. If no, step 5b: break on the next kernel launch. Step 6: detach. The application keeps running.</desc>
