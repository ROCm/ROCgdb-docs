<title id="t">Where to send a ROCgdb problem</title>
<desc id="d">Flowchart. Start: still stuck after the steps on this page. If the application doesn't work without ROCgdb, fix the application or ROCm setup first. ROCm problems go to ROCm/TheRock issues. If it works and a row in Known limitations matches, use that row's workaround, or accept the behavior as expected if the row has none. Otherwise, if the problem is in the documentation, open a ROCgdb-docs issue. If not, search ROCgdb issues, then open one with the evidence.</desc>
