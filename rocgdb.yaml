# Source for the ROCgdb GDB manuals.
#
# The documentation build (GitHub Actions) and Read the Docs both read this file
# to decide which ROCgdb commit to build/download:
#   - if `commit` is set, that exact commit is used (reproducible);
#   - otherwise the latest commit of `branch` is resolved via `git ls-remote`.
#
# ROCgdb is no longer a git submodule; it is cloned from `url` at build time.
rocgdb:
  url: https://github.com/ROCm/ROCgdb.git
  branch: release/therock-10.1
  # Optional. Pin to a specific commit for reproducible builds; leave empty to
  # track the latest commit of `branch`.
  commit: 7e541ef6fe7d5ad8172cf227656103f22f975226
