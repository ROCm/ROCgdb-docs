# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: docs/conf.py

formats: [htmlzip, pdf, epub]

python:
   install:
   - requirements: docs/sphinx/requirements.txt

build:
   os: ubuntu-22.04
   tools:
      python: "3.10"
   jobs:
      # The GDB manuals (HTML + PDF) are built by the "Build GDB docs" GitHub
      # Actions workflow and published as a release asset keyed by the resolved
      # ROCgdb commit, because the native build exceeds the Read the Docs
      # build-time limit. ROCgdb is no longer a submodule: resolve the same commit
      # from rocgdb.yaml (pinned commit wins, else latest of branch), download the
      # matching asset, and extract it. The asset bundles version.in, COPYING and
      # rocgdb-build-info.txt, which docs/conf.py reads (no ROCgdb checkout needed).
      # --fail: if the asset is missing the build fails loudly (e.g. the Actions
      # build for this commit has not finished yet) rather than shipping dead links.
      pre_build:
         - pip install pyyaml
         - >-
            TAG=$(python3 scripts/resolve_rocgdb_commit.py --tag);
            curl --fail --location --show-error --silent
            --output rocgdb-docs-html-pdf.tar.gz
            "https://github.com/ROCm/ROCgdb-docs/releases/download/${TAG}/rocgdb-docs-html-pdf.tar.gz"
         - tar -xzf rocgdb-docs-html-pdf.tar.gz
