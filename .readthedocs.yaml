# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: docs/conf.py

formats: [htmlzip, pdf, epub]

# conf.py reads the GDB version from ROCgdb/gdb/version.in and copies
# ROCgdb/COPYING -> LICENSE, so the submodule must be checked out. This is a
# cheap clone only; the heavy GDB build runs in GitHub Actions, not here.
submodules:
   include:
      - ROCgdb

python:
   install:
   - requirements: docs/sphinx/requirements.txt

build:
   os: ubuntu-22.04
   tools:
      python: "3.10"
   jobs:
      # The GDB manuals (HTML + PDF) are built by the "Build GDB docs" GitHub
      # Actions workflow and published as a release asset keyed by the ROCgdb
      # submodule commit, because the native build exceeds the Read the Docs
      # build-time limit. Derive that same commit here and download the matching
      # asset instead of building. This makes each RTD version pull exactly the
      # docs for its pinned submodule commit, independent of branch.
      # --fail: if the asset is missing the build fails loudly (e.g. the Actions
      # build for this submodule commit has not finished yet) rather than
      # shipping dead links.
      pre_build:
         - >-
            curl --fail --location --show-error --silent
            --output rocgdb-docs-html-pdf.tar.gz
            "https://github.com/ROCm/ROCgdb-docs/releases/download/gdb-docs-$(git rev-parse HEAD:ROCgdb)/rocgdb-docs-html-pdf.tar.gz"
         - tar -xzf rocgdb-docs-html-pdf.tar.gz
