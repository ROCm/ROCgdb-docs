# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
   configuration: docs/conf.py

formats: [htmlzip, pdf, epub]

python:
   install:
   - requirements: docs/sphinx/requirements.txt

build:
   os: ubuntu-22.04
   tools:
      python: "3.10"
   # Toolchain for building the GDB manuals: build-essential/bison/flex to
   # configure the tree, libgmp-dev and libmpfr-dev for GDB's configure, texinfo
   # for makeinfo (HTML), and texlive for texi2dvi/pdftex (PDF).
   apt_packages:
      - build-essential
      - libgmp-dev
      - libmpfr-dev
      - texinfo
      - bison
      - flex
      - texlive
      - texlive-plain-generic
   jobs:
      # Build the GDB manuals here rather than downloading a prebuilt asset.
      # ROCgdb is not a submodule: fetch_rocgdb.sh shallow-fetches the commit
      # resolved from rocgdb.yaml, then build_docs.sh generates the HTML into
      # _readthedocs/html/ROCgdb and the PDFs into docs/_static/pdf/ROCgdb.
      # docs/conf.py reads the version and license from that checkout.
      #
      # This was previously impossible: the build took ~16 min against a ~15 min
      # limit. After narrowing it to the doc targets and skipping the sibling
      # binutils components it measures ~3 min end to end (44s apt, 34s shallow
      # fetch, 106s configure + do-html + do-pdf), so the whole pipeline now fits
      # in one config file with no workflow, release asset or API token.
      pre_build:
         - pip install pyyaml
         - bash scripts/fetch_rocgdb.sh
         - bash build_docs.sh
