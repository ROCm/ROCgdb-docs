name: Build GDB docs and publish release asset

# The GDB manuals (HTML via makeinfo, PDF via texi2dvi/pdftex) are built from the
# ROCgdb submodule. This is a ~16 min native build that exceeds the Read the Docs
# build-time limit, so it runs here instead and publishes the result as a release
# asset that Read the Docs downloads during its own (light) build.
#
# The asset is keyed by the ROCgdb submodule commit, NOT by branch: the docs
# depend only on that commit plus build_docs.sh. Any branch (amd-staging,
# docs/10.1.0, ...) whose submodule points at the same commit reuses the same
# asset, so the build runs at most once per unique submodule commit.

on:
  push:
    branches:
      - amd-staging
      - "docs/**"
      - update-rocgdb-amd-staging
    paths:
      # A submodule pointer bump is a change to the gitlink at this path.
      - ROCgdb
      - build_docs.sh
      - .github/workflows/build-gdb-docs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize per submodule commit so two branches sharing a commit don't race
  # to create the same release. Resolved to the SHA in the job below.
  group: build-gdb-docs-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository and ROCgdb submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve ROCgdb submodule commit (the asset key)
        id: key
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD:ROCgdb)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=gdb-docs-$SHA" >> "$GITHUB_OUTPUT"
          echo "Submodule commit: $SHA"

      - name: Skip if this submodule commit was already built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.key.outputs.tag }}" \
               --json assets --jq '.assets[].name' 2>/dev/null \
               | grep -qx "rocgdb-docs-html-pdf.tar.gz"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Asset for ${{ steps.key.outputs.tag }} already exists; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgmp-dev libmpfr-dev texinfo bison flex \
            texlive texlive-plain-generic

      - name: Build GDB HTML and PDF
        if: steps.check.outputs.exists == 'false'
        run: bash build_docs.sh

      - name: Package outputs
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          test -f _readthedocs/html/ROCgdb/gdb/doc/gdb/index.html
          ls docs/_static/pdf/ROCgdb/*.pdf >/dev/null
          tar -czf rocgdb-docs-html-pdf.tar.gz \
            _readthedocs/html/ROCgdb \
            docs/_static/pdf/ROCgdb
          echo "case-collision pairs preserved (expect 2 for bss.html/Bss.html):"
          tar -tzf rocgdb-docs-html-pdf.tar.gz | grep -ciE '/bss\.html$'

      - name: Publish release asset keyed by submodule commit
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.key.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "GDB docs for ROCgdb ${{ steps.key.outputs.sha }}" \
              --notes "GDB HTML + PDF built from ROCgdb ${{ steps.key.outputs.sha }} and consumed by Read the Docs. Auto-generated; do not edit."
          fi
          gh release upload "$TAG" rocgdb-docs-html-pdf.tar.gz --clobber

      - name: Trigger Read the Docs build for this branch
        # The asset exists now (just published, or already present via dedup), so
        # it is safe to kick the matching Read the Docs version. This sequences
        # the two systems: RTD's pre_build downloads the asset instead of racing
        # it. Only regular (branch) versions can be triggered via the API; PR
        # preview (external) versions rebuild only on new PR commits, so they are
        # intentionally not handled here. This step never fails the workflow -
        # publishing the asset above is the critical outcome; a trigger problem
        # is surfaced as a warning so a misconfigured token/slug is visible.
        if: github.event_name == 'push'
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
          # Override with repo variables if the project slug or API host differ
          # (Business tier uses app.readthedocs.com).
          RTD_PROJECT: ${{ vars.RTD_PROJECT || 'advanced-micro-devices-rocgdb-internal' }}
          RTD_HOST: ${{ vars.RTD_HOST || 'app.readthedocs.org' }}
        run: |
          set -uo pipefail
          if [ -z "${RTD_TOKEN:-}" ]; then
            echo "::warning::RTD_TOKEN secret not set; skipping Read the Docs trigger. Rebuild the RTD version manually once this run is green."
            exit 0
          fi
          # RTD slugifies branch names (e.g. '/' -> '-'): docs/10.1.0 -> docs-10.1.0.
          VERSION="${GITHUB_REF_NAME//\//-}"
          URL="https://${RTD_HOST}/api/v3/projects/${RTD_PROJECT}/versions/${VERSION}/builds/"
          echo "Triggering Read the Docs build: POST $URL"
          CODE=$(curl -sS -o /tmp/rtd_resp.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Token ${RTD_TOKEN}" \
            -H "Content-Length: 0" || echo "000")
          echo "Read the Docs API returned HTTP $CODE"
          cat /tmp/rtd_resp.json 2>/dev/null || true
          echo
          case "$CODE" in
            20*) echo "Triggered Read the Docs build for version '$VERSION'." ;;
            404) echo "::warning::Read the Docs version '$VERSION' not found - this branch may not be an RTD version. No build triggered." ;;
            *)   echo "::warning::Read the Docs trigger returned HTTP $CODE; no build triggered. Trigger it manually if this branch should publish." ;;
          esac
