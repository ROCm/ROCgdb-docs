<span id="S12Z-1"></span><h4 class="subsection">22.4.9 S12Z</h4>
<span id="index-S12Z-support"></span>

<p>When <small>ROCGDB</small> is debugging the S12Z architecture,
it provides the following special command:
</p>
<dl compact="compact">
<dt id='index-maint-info-bdccsr_002c-S12Z'><span><code>maint info bdccsr</code><a href='#index-maint-info-bdccsr_002c-S12Z' class='copiable-anchor'> &para;</a></span></dt>
<dd><p>This command displays the current value of the microprocessor&rsquo;s
BDCCSR register.
</p></dd>
</dl>
