<h4 class="subsection section-level-set-subsection" id="Options-26"><span>9.47.1 Options<a class="copiable-link" href="#Options-26"> &para;</a></span></h4>

<p>The following table lists all available TILE-Gx specific options:
</p>
<dl class="table">
<dt><a class="index-entry-id" id="index-_002dm64-option_002c-TILE_002dGx"></a>
<a id="index-_002dm32-option_002c-TILE_002dGx"></a><span><code class="code">-m32 | -m64</code><a class="copiable-link" href="#index-_002dm32-option_002c-TILE_002dGx"> &para;</a></span></dt>
<dd><p>Select the word size, either 32 bits or 64 bits.
</p>
</dd>
<dt><a class="index-entry-id" id="index-_002dEL-option_002c-TILE_002dGx"></a>
<a id="index-_002dEB-option_002c-TILE_002dGx"></a><span><code class="code">-EB | -EL</code><a class="copiable-link" href="#index-_002dEB-option_002c-TILE_002dGx"> &para;</a></span></dt>
<dd><p>Select the endianness, either big-endian (-EB) or little-endian (-EL).
</p>
</dd>
</dl>
